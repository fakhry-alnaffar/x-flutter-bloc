name: onix_flutter_bloc
description: Onix Flutter Bloc — a modern, production-ready state management framework built on flutter_bloc with seamless integration into the Onix Flutter Core ecosystem.
version: 1.0.0
repository: https://github.com/fakhry-alnaffar/onix-flutter-bloc
publish_to: none

topics:
  - bloc
  - state-management
  - flutter
  - architecture
  - framework

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  loader_overlay: ^5.0.0

  onix_flutter_core:
    git:
      url: https://github.com/fakhry-alnaffar/onix-flutter-core.git
      ref: main

  onix_flutter_core_models:
    git:
      url: https://github.com/fakhry-alnaffar/onix-flutter-core-models.git
      ref: main

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  test: ^1.31.1
