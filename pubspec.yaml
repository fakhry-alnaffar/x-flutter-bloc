name: x_flutter_bloc
description: X Flutter Bloc — a modern, production-ready state management framework built on flutter_bloc with seamless integration into the X Flutter Core ecosystem.
version: 1.0.0
repository: https://github.com/fakhry-alnaffar/x-flutter-bloc
issue_tracker: https://github.com/fakhry-alnaffar/x-flutter-bloc/issues

topics:
  - bloc
  - state-management
  - flutter
  - architecture
  - framework

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  loader_overlay: ^5.0.0
  flutter_screenutil: ^5.9.3
  equatable: ^2.0.8

  x_flutter_core_models: ^0.1.4
  x_flutter_core: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
